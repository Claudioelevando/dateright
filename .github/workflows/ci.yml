name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Segredos reais nunca entram aqui — os valores abaixo são placeholders só pra satisfazer o
# build (client bundla NEXT_PUBLIC_*, alguns módulos fazem `process.env.X!` no import). Nenhum
# deles precisa apontar pra um serviço de verdade: build e type-check não fazem chamada de rede.
# Sentry fica de fora de propósito — sem SENTRY_AUTH_TOKEN o plugin de build pula upload de
# source maps em vez de tentar autenticar com credencial falsa.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgres://user:pass@localhost:5432/dateright"
  DIRECT_URL: "postgres://user:pass@localhost:5432/dateright"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "dummy"
  SUPABASE_SERVICE_ROLE_KEY: "dummy"
  STRIPE_SECRET_KEY: "sk_test_dummy"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_dummy"
  STRIPE_PREMIUM_PRICE_ID: "price_dummy"
  RESEND_API_KEY: "dummy"
  RESEND_FROM_EMAIL: "noreply@example.com"
  NEXT_PUBLIC_FIREBASE_API_KEY: "dummy"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "dummy"
  NEXT_PUBLIC_FIREBASE_APP_ID: "dummy"
  NEXT_PUBLIC_FIREBASE_VAPID_KEY: "dummy"
  FIREBASE_SERVICE_ACCOUNT_JSON: "{}"
  NEXT_PUBLIC_POSTHOG_KEY: "dummy"
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "dummy"
  GOOGLE_MAPS_API_KEY: "dummy"
  KV_REST_API_URL: "https://example.upstash.io"
  KV_REST_API_TOKEN: "dummy"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Gerar client do Prisma
        run: npm run db:generate

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # tsc --noEmit sozinho não conhece os tipos de rota gerados pelo Next.js (ex: LayoutProps)
      # — só `next build`/`next dev` os gera. `next typegen` faz só essa parte, sem build completo.
      - name: Gerar tipos de rota do Next.js
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
